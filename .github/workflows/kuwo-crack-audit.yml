name: kuwo-crack-audit

# KUWO-1：酷我 12.2.2.0 天天版（CN=xinshidai0 重签，15 dex）后门审计素材线（rid recvv1L7iC5va5）
# 配方继承 hongguo-crack-audit：重活全在 runner，CT110/本机零重活（D7 红线）。
# ① mod 15dex vs 官方基线 dex 全量 diff（类名对齐+调试指令剥离，双侧同集合口径——hg2 漂移红线）
# ② 端点素材：URL 差集 + api.ktvdaren.com 引用上下文
# ③ 动态加载/敏感API素材（业务命名空间口径）
# ④ native so 逐一对比 hash（只对比不深逆向）
# 版权红线：样本 APK 不落 git（Release 分发，runner 磁盘临时）；baksmali 全文走 Release kuwo1-artifacts。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 下载 baksmali 3.0.10
        run: |
          curl -sSL -o /usr/local/bin/baksmali.jar https://github.com/baksmali/smali/releases/download/3.0.10/baksmali-3.0.10-fat.jar
          java -jar /usr/local/bin/baksmali.jar --version

      - name: 拉样本 + sha256 全量校验
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work && cd work
          gh release download samples -R "$GITHUB_REPOSITORY" -p 'kuwo-12.2.2.0-tiantian-mod.apk' -p 'kuwo-12.2.2.0-official.apk' -D .
          echo "f2f20005e7234025383a517053703a922173fd05dbc7d6a48d09c62fe9b8732b  kuwo-12.2.2.0-tiantian-mod.apk" | sha256sum -c -
          # 官方基线 sha256 由基线获取步骤登记后回填本行（占位符存在即失败，防错包）
          grep -q 'OFFICIAL-SHA256-PENDING' ../docs/baseline-official.md && { echo "FATAL: 官方基线 sha256 未登记"; exit 1; } || true
          OFFICIAL_SHA=$(grep -oE '^[0-9a-f]{64}' ../docs/baseline-official.md | head -1)
          echo "$OFFICIAL_SHA  kuwo-12.2.2.0-official.apk" | sha256sum -c -
          df -h .

      - name: 解包（dex + so，双侧全量）
        run: |
          cd work
          python3 - <<'EOF'
          import zipfile, os
          os.makedirs('mod-dex', exist_ok=True); os.makedirs('base-dex', exist_ok=True)
          os.makedirs('so-mod', exist_ok=True); os.makedirs('so-base', exist_ok=True)
          def dump(apk, dout, sout):
              z = zipfile.ZipFile(apk)
              dexs = [n for n in z.namelist() if n.startswith('classes') and n.endswith('.dex')]
              for n in dexs:
                  open(os.path.join(dout, n), 'wb').write(z.read(n))
              sos = [n for n in z.namelist() if n.endswith('.so') and n.startswith('lib/')]
              for n in sos:
                  open(os.path.join(sout, n.replace('/', '_')), 'wb').write(z.read(n))
              return len(dexs), len(sos)
          print('mod :', dump('kuwo-12.2.2.0-tiantian-mod.apk', 'mod-dex', 'so-mod'))
          print('base:', dump('kuwo-12.2.2.0-official.apk', 'base-dex', 'so-base'))
          EOF
          echo "mod dex: $(ls mod-dex/classes*.dex | wc -l) so: $(ls so-mod | wc -l) ｜ base dex: $(ls base-dex/classes*.dex | wc -l) so: $(ls so-base | wc -l)"

      - name: baksmali 双包全量反编译
        run: |
          cd work
          for D in mod-dex/classes*.dex; do N=$(basename "$D" .dex); java -Xmx4g -jar /usr/local/bin/baksmali.jar d "$D" -o "smali-mod/$N"; done
          for D in base-dex/classes*.dex; do N=$(basename "$D" .dex); java -Xmx4g -jar /usr/local/bin/baksmali.jar d "$D" -o "smali-base/$N"; done
          echo "smali-mod 文件数: $(find smali-mod -name '*.smali' | wc -l)"
          echo "smali-base 文件数: $(find smali-base -name '*.smali' | wc -l)"

      - name: diff + 端点 + 素材三脚本
        run: |
          cd work
          python3 ../scripts/kuwo1_diff.py "$PWD" | tee diff-run.log
          python3 ../scripts/kuwo1_endpoints.py "$PWD" | tee ep-run.log
          python3 ../scripts/kuwo1_materials.py "$PWD" | tee mat-run.log
          cd diff-out/docs && tar czf "$GITHUB_WORKSPACE/work/kuwo1-diff-baksmali.tar.gz" kuwo1-diff-baksmali/ && cd "$GITHUB_WORKSPACE/work"
          du -h diff-out/docs/* kuwo1-diff-baksmali.tar.gz | sort -rh | head

      - name: 回写报告到仓库 docs/
        run: |
          cd "$GITHUB_WORKSPACE"
          cp work/diff-out/docs/kuwo1-diff-report.md docs/kuwo1-diff-report.md
          cp work/diff-out/docs/kuwo1-endpoints.md docs/kuwo1-端点素材.md
          cp work/diff-out/docs/kuwo1-materials.md docs/kuwo1-动态加载-敏感API-so素材.md
          git config user.name "codery-ci"
          git config user.email "codery-ci@noreply"
          git add docs/
          git commit -m "docs(KUWO-1): mod vs 官方基线 dex diff + 端点/动态加载/敏感API/so 素材" || echo "无变更"
          git pull --rebase origin main && git push origin main

      - name: 上传 baksmali 归档到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE"
          gh release create kuwo1-artifacts --title "KUWO-1 baksmali 全文归档+素材附件" --notes "mod vs 官方基线 diff 三清单全文（added/changed/removed）+ 端点/素材 md。不进 git。" 2>/dev/null || true
          gh release upload kuwo1-artifacts work/kuwo1-diff-baksmali.tar.gz work/diff-out/docs/kuwo1-endpoints.md work/diff-out/docs/kuwo1-materials.md --clobber
          gh release upload kuwo1-artifacts work/added-classes.txt work/changed-classes.txt work/removed-classes.txt work/ep-diff-urls.txt --clobber

      - name: 清理版权物
        if: always()
        run: rm -rf work
