name: kuwo3b2-purify-build

# KUWO-3b2/R2b：净化重打包（rid recvv1L7iC5va5 · round2=3b2 三桩 + R2b 双桥 patch 合并）
# round2 patch 全集=5 处：3b2 三桩（c.h()V return-void / b3/a 2 init nop / sd/d 2 invoke nop）
#   + R2b 双桥（q1.b.a init 2×nop / uilib.m F 按值过滤）。宁残骸不断链，禁撒网。
# 签名=本线 keystore（CN=KUWO-Purify，secrets 四项，keystore 不进仓）。
# 版权红线：样本/产物 APK 不入 git（Release 分发）。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK（build-tools 35）
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-30" "build-tools;35.0.0" > /dev/null
          echo "BT=$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_ENV"

      - name: 下载 apktool 3.0.3
        run: |
          curl -sSL -o /usr/local/bin/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          java -jar /usr/local/bin/apktool.jar --version

      - name: secrets 零缺失门
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          MISS=0
          for k in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!k:-}" ] || { echo "!! secret $k 缺失"; MISS=1; }
          done
          [ "$MISS" = "0" ] || exit 1
          echo "SECRETS-OK 四项齐"

      - name: 拉样本 + sha256 校验
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work && cd work
          gh release download samples -R "$GITHUB_REPOSITORY" -p 'kuwo-12.2.2.0-tiantian-mod.apk' -D .
          echo "f2f20005e7234025383a517053703a922173fd05dbc7d6a48d09c62fe9b8732b  kuwo-12.2.2.0-tiantian-mod.apk" | sha256sum -c -
          df -h .

      - name: apktool d -r 解包（-r 保资源不重编）
        run: |
          cd work
          java -Xmx6g -jar /usr/local/bin/apktool.jar d -f -r -o mod_src kuwo-12.2.2.0-tiantian-mod.apk
          echo "smali 树: $(find mod_src -name '*.smali' | wc -l) 文件 ｜ dex 目录: $(ls -d mod_src/smali* | wc -l)"

      - name: 四处 patch（round5：3b2 P2/P3 + R2b 双桥；P1 已撤销=老马 r4 实测副作用，宁失败不静默）
        run: |
          cd work
          python3 ../scripts/kuwo3b2_patch.py mod_src patch-evidence.txt | tee patch-kuwo3b2.log
          grep -q 'KUWO3B2-PATCH DONE P1=1 P2=2 P3=2' patch-kuwo3b2.log || { echo '!! 3b2 计数不达预期（P1=撤销模式验证）'; exit 1; }
          python3 ../scripts/kuwo_r2b_patch.py mod_src patch-evidence-r2b.txt | tee patch-kuwo-r2b.log
          grep -q 'R2B-PATCH DONE B1=1 B2=0(revoked) C1=1' patch-kuwo-r2b.log || { echo '!! R2b round6 计数不达预期（B2 撤销+B1+C1 兜底）'; exit 1; }
          cat patch-evidence.txt patch-evidence-r2b.txt > patch-evidence-all.txt

      - name: patch 自检（四桩落位 + P1 撤销验证 + 残活门，bash -e 计数 || true 兜底）
        run: |
          cd work
          echo "== 3b2 P1(撤销验证): c.smali h()V 无 return-void 桩（round5）=="
          S=$(grep -A3 '.method public static h()V' mod_src/smali*/cn/kuwo/mod/mobilead/tmead/c.smali | { grep -c 'KUWO3B2-P1 return-void inserted' || true; })
          echo "P1 历史桩残留=$S（须 0，非 0=工作树污染）"; [ "$S" = "0" ] || exit 1
          echo "== R2b B2(撤销验证): q1.b.a init invoke 必须在（round6 恢复官方逻辑）=="
          R=$(grep -A20 '.method private static a(Lq1/a;)V' mod_src/smali*/q1/b.smali | { grep -c 'Lq1/a;->init()V' || true; })
          echo "q1.b.a init invoke 数=$R（须 1）"; [ "$R" = "1" ] || { echo '!! B2 撤销失败: init invoke 不在'; exit 1; }
          echo "== R2b C1: specialdialogconfig.a.init 体首 return-void 落位 =="
          grep -A3 '.method public init()V' mod_src/smali*/cn/kuwo/peculiar/specialdialogconfig/a.smali | head -4
          echo "== R2b B1: uilib.m F 体首值过滤落位 =="
          grep -A8 '.method public static F(Ljava/lang/String;Z)V' mod_src/smali*/cn/kuwo/base/uilib/m.smali | head -9
          echo "== 残活门: b3/a 与 sd/d init 残活须 0 =="
          R2=$(grep -A30 '.method public b()V' mod_src/smali*/b3/a.smali | grep -v '^[[:space:]]*#' | { grep -c 'Lcom/tme/rif/\(config/ConfigManager\|service/ServiceManager\);->init' || true; })
          echo "b3/a 残活=$R2（须 0）"; [ "$R2" = "0" ] || exit 1
          R3=$(grep -A40 'public b(Landroid/content/Context;Ljava/lang/String;)V' mod_src/smali*/sd/d.smali | grep -v '^[[:space:]]*#' | { grep -c 'Lcom/tme/fireeye/lib/base/FireEye;->\(init\|start\)' || true; })
          echo "sd/d 残活=$R3（须 0）"; [ "$R3" = "0" ] || exit 1

      - name: apktool b 重建（dex 240MB 重汇编预计 15-25min）
        run: |
          cd work
          java -Xmx8g -jar /usr/local/bin/apktool.jar b -f mod_src -o clean-unsigned.apk
          ls -la clean-unsigned.apk

      - name: zipalign -P 16 + apksigner v1v2v3（本线 keystore）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd work
          "$BT/zipalign" -f -p 16 clean-unsigned.apk clean-aligned.apk
          echo "$KEYSTORE_BASE64" | base64 -d > kuwo-purify.jks
          "$BT/apksigner" sign --ks kuwo-purify.jks --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out signed.apk clean-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs signed.apk | tee verify-kuwo3b2.txt
          sha256sum signed.apk | tee sha256-kuwo3b2.txt

      - name: 构建后验证：五桩 dex 反解生效（MUST DO 硬门）
        run: |
          cd work
          curl -sSL -o /usr/local/bin/baksmali.jar https://github.com/baksmali/smali/releases/download/3.0.10/baksmali-3.0.10-fat.jar
          python3 - <<'EOF'
          import zipfile
          z = zipfile.ZipFile('signed.apk')
          dexs = [n for n in z.namelist() if n.startswith('classes') and n.endswith('.dex')]
          print('产物 dex 数:', len(dexs))
          assert len(dexs) == 15, 'dex 数异常(应 15)'
          # 桩类按关键词定位所在 dex
          keys = {'tmead': 'p12', 'mobilead': 'p12', 'b3/a': None, 'uilib/m': None, 'q1/b': None, 'fireeye': 'p3'}
          opens = {}
          for n in dexs:
              d = z.read(n)
              tags = []
              if b'Lcn/kuwo/mod/mobilead/tmead/c;' in d: tags.append('p12')
              if b'Lq1/b;' in d: tags.append('pqb')
              if b'Lcn/kuwo/base/uilib/m;' in d: tags.append('pum')
              if b'Lcom/tme/fireeye/lib/base/FireEye;' in d: tags.append('p3')
              if b'Lb3/a;' in d: tags.append('pb3')
              if b'Lsd/d;' in d: tags.append('psd')
              for t in set(tags):
                  opens.setdefault(t, []).append(n)
          import json
          json.dump(opens, open('pile-dex-map.json', 'w'))
          print(opens)
          # MUST：把各桩 dex 从 zip 解出落盘（round5 实锤：只定位不解出，baksmali 读不到）
          import os
          for ns in set(v[0] for v in opens.values()):
              if not os.path.exists(ns):
                  open(ns, 'wb').write(z.read(ns))
          EOF
          for N in $(python3 -c "import json;print(' '.join(sorted(set(v[0] for v in json.load(open('pile-dex-map.json')).values()))))"); do
            java -Xmx4g -jar /usr/local/bin/baksmali.jar d "$N" -o "chk-${N%.dex}"
          done
          echo "== 四桩验证（find 循环定位，防路径写死；P1 已撤销不验 return-void）=="
          echo "-- P1(撤销验证): c.h()V 无 return-void 桩 --"
          for f in $(find chk-classes* -path '*mod/mobilead/tmead/c.smali'); do awk '/\.method public static h\(\)V/,/\.end method/' "$f" | head -5; done
          echo "-- B2: q1.b.a init 已 nop --"
          for f in $(find chk-classes* -path '*/q1/b.smali'); do awk '/\.method private static a\(Lq1\/a;\)V/,/\.end method/' "$f" | grep -E 'nop|init' | head -5; done
          echo "-- B1: uilib.m F 体首值过滤 --"
          for f in $(find chk-classes* -path '*base/uilib/m.smali'); do awk '/\.method public static F\(Ljava\/lang\/String;Z\)V/,/\.end method/' "$f" | head -9; done
          echo "-- P2: b3/a init 已 nop --"
          for f in $(find chk-classes* -path '*/b3/a.smali'); do awk '/\.method public b\(\)V/,/\.end method/' "$f" | grep -cE 'nop' || true; done
          echo "-- P3: sd/d FireEye 已 nop --"
          for f in $(find chk-classes* -path '*/sd/d.smali'); do awk '/public b\(Landroid\/content\/Context;Ljava\/lang\/String;\)V/,/\.end method/' "$f" | grep -cE 'nop' || true; done

      - name: 计算 round + 发 Release + 回写报告
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE"
          LAST=$(gh release list -R "$GITHUB_REPOSITORY" 2>/dev/null | grep -oE 'kuwo3-round[0-9]+' | grep -oE '[0-9]+' | sort -n | tail -1 || true)
          N=$(( ${LAST:-0} + 1 ))
          OUT="kuwo-12.2.2.0-purified-r${N}.apk"
          cp work/signed.apk "work/$OUT"
          cp work/sha256-kuwo3b2.txt work/sha256-r${N}.txt
          gh release create "kuwo3-round${N}" --title "KUWO 净化重打包 round ${N}（3b2 三桩 + R2b 双桥）" \
            --notes "round${N} patch 全集 4 处（P1/B2 已撤销=真机实测殃及 BirthScreenHelper 致 NPE）：rif 2 init nop + fireeye 2 invoke nop + uilib.m F 按值过滤（QQ频道文案直显拦截）+ specialdialogconfig.a.init 体首 return-void（config 填充兜底，不碰 q1.b 桥）。宁残骸不断链；本线自签 keystore CN=KUWO-Purify v1v2v3。run ${GITHUB_RUN_ID}" \
            "work/$OUT" work/patch-kuwo3b2.log work/patch-kuwo-r2b.log work/patch-evidence-all.txt work/verify-kuwo3b2.txt work/sha256-r${N}.txt
          {
            echo "# KUWO round ${N} 构建报告（run ${GITHUB_RUN_ID}）"
            echo
            echo "- 产物：Release kuwo3-round${N} / ${OUT}"
            echo "- sha256：$(cut -d' ' -f1 work/sha256-kuwo3b2.txt)"
            echo "- 大小：$(stat -c %s "work/$OUT") B"
            echo "- patch 全集 4 处（round6：P1/B2 均撤销=真机实测副作用）：P2=2（b3/a init nop）/ P3=2（sd/d FireEye nop）/ B1=1（uilib.m F 按值过滤）/ C1=1（specialdialogconfig.a.init 体首 return-void 兜底）——其余未碰"
            echo "- 签名：本线 keystore CN=KUWO-Purify（cert sha256 见 verify-kuwo3b2.txt），v1+v2+v3"
            echo "- 验证：apksigner verify 过 + 四桩 dex 反解（P1/B2 已撤销）+ dex 数 15"
            echo "- 版本一致性：round 单源=Release tag kuwo3-round${N} 自动递增（${LAST:-无}→${N}）"
          } > docs/kuwo3b2-build-report.md
          git config user.name "codery-ci"
          git config user.email "codery-ci@noreply"
          git add docs/kuwo3b2-build-report.md
          git commit -m "docs(KUWO): round ${N} 净化构建——P1/B2 撤销+四桩（apk 见 Release kuwo3-round${N}）" || echo "无变更"
          git pull --rebase origin main && git push origin main
          echo "== 产物 $OUT sha=$(cut -d' ' -f1 work/sha256-kuwo3b2.txt) size=$(stat -c %s "work/$OUT")"

      - name: 清理版权物
        if: always()
        run: rm -rf work
