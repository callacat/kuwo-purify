name: kuwo3b2-purify-build

# KUWO-3b2：酷我天天版净化重打包（rid recvv1L7iC5va5 · 老马点位表 §2 执行单）
# patch 点全集=3 处（c.smali h()V return-void / b3/a 2 init nop / sd/d 2 invoke nop），宁残骸不断链，禁撒网。
# 签名=本线新生成 keystore（CN=KUWO-Purify，指纹 8A5496AF…F917，secrets 四项零缺失门先过，keystore 不进仓）。
# 版本纪律：产物名/round 单源=Release tag kuwo3-round<N> 自动递增；三处一致性由构建期注入（报告写明）。
# 版权红线：样本/产物 APK 不入 git（Release 分发）。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK（build-tools 35）
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-30" "build-tools;35.0.0" > /dev/null
          echo "BT=$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_ENV"

      - name: 下载 apktool 3.0.3
        run: |
          curl -sSL -o /usr/local/bin/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          java -jar /usr/local/bin/apktool.jar --version

      - name: secrets 零缺失门
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          MISS=0
          for k in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!k:-}" ] || { echo "!! secret $k 缺失"; MISS=1; }
          done
          [ "$MISS" = "0" ] || exit 1
          echo "SECRETS-OK 四项齐"

      - name: 拉样本 + sha256 校验
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work && cd work
          gh release download samples -R "$GITHUB_REPOSITORY" -p 'kuwo-12.2.2.0-tiantian-mod.apk' -D .
          echo "f2f20005e7234025383a517053703a922173fd05dbc7d6a48d09c62fe9b8732b  kuwo-12.2.2.0-tiantian-mod.apk" | sha256sum -c -
          df -h .

      - name: apktool d -r 解包（-r 保资源不重编）
        run: |
          cd work
          java -Xmx6g -jar /usr/local/bin/apktool.jar d -f -r -o mod_src kuwo-12.2.2.0-tiantian-mod.apk
          echo "smali 树: $(find mod_src -name '*.smali' | wc -l) 文件 ｜ dex 目录: $(ls -d mod_src/smali* | wc -l)"

      - name: 三处 patch（老马点位表 §2，宁失败不静默）
        run: |
          cd work
          python3 ../scripts/kuwo3b2_patch.py mod_src patch-evidence.txt | tee patch-kuwo3b2.log
          grep -q 'KUWO3B2-PATCH DONE P1=1 P2=2 P3=2' patch-kuwo3b2.log || { echo '!! patch 计数不达点位表预期'; exit 1; }

      - name: patch 自检（桩落位 + 范围门：点外 invoke 不许动）
        run: |
          cd work
          echo "== P1: c.smali h()V 体首 return-void =="
          grep -A2 '.method public static h()V' mod_src/smali*/cn/kuwo/mod/mobilead/tmead/c.smali | head -4
          echo "== P2/P3: 残活 invoke 应为 0（同方法签名内，排除 patch 注释行）=="
          R=$(grep -A30 '.method public b()V' mod_src/smali*/b3/a.smali | grep -v '^[[:space:]]*#' | { grep -c 'Lcom/tme/rif/\(config/ConfigManager\|service/ServiceManager\);->init' || true; })
          echo "b3/a ConfigManager|ServiceManager init 残活=$R（须 0）"; [ "$R" = "0" ] || { grep -A30 '.method public b()V' mod_src/smali*/b3/a.smali | grep 'Lcom/tme/rif/\(config/ConfigManager\|service/ServiceManager\);->init'; exit 1; }
          R2=$(grep -A40 'public b(Landroid/content/Context;Ljava/lang/String;)V' mod_src/smali*/sd/d.smali | grep -v '^[[:space:]]*#' | { grep -c 'Lcom/tme/fireeye/lib/base/FireEye;->\(init\|start\)' || true; })
          echo "sd/d FireEye init|start 残活=$R2（须 0）"; [ "$R2" = "0" ] || { grep -A40 'public b(Landroid/content/Context;Ljava/lang/String;)V' mod_src/smali*/sd/d.smali | grep 'Lcom/tme/fireeye/lib/base/FireEye;->\(init\|start\)'; exit 1; }
          echo "== 范围门: j()Z 与 Other init 未动 =="
          grep -c '.method public static j()Z' mod_src/smali*/cn/kuwo/mod/mobilead/tmead/c.smali || true
          grep -A30 '.method public b()V' mod_src/smali*/b3/a.smali | grep -c 'HG2\|OtherManager' || true

      - name: apktool b 重建（dex 240MB 重汇编预计 15-25min）
        run: |
          cd work
          java -Xmx8g -jar /usr/local/bin/apktool.jar b -f mod_src -o clean-unsigned.apk
          ls -la clean-unsigned.apk

      - name: zipalign -P 16 + apksigner v1v2v3（本线 keystore）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd work
          "$BT/zipalign" -f -p 16 clean-unsigned.apk clean-aligned.apk
          echo "$KEYSTORE_BASE64" | base64 -d > kuwo-purify.jks
          "$BT/apksigner" sign --ks kuwo-purify.jks --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out signed.apk clean-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs signed.apk | tee verify-kuwo3b2.txt
          sha256sum signed.apk | tee sha256-kuwo3b2.txt

      - name: 构建后验证：三桩 dex 反解生效（MUST DO 硬门）
        run: |
          cd work
          curl -sSL -o /usr/local/bin/baksmali.jar https://github.com/baksmali/smali/releases/download/3.0.10/baksmali-3.0.10-fat.jar
          python3 - <<'EOF'
          import zipfile
          z = zipfile.ZipFile('signed.apk')
          dexs = [n for n in z.namelist() if n.startswith('classes') and n.endswith('.dex')]
          print('产物 dex 数:', len(dexs))
          assert len(dexs) == 15, 'dex 数异常(应 15)'
          # 抽目标 dex 定位三桩：c.smali 在 classes8、b3/a 同 dex、sd/d 在 classes9 附近——按关键词扫描
          targets = {
              'P1_c_hV': 'cn/kuwo/mod/mobilead/tmead/c',
              'P2_b3_a': 'b3/a',
              'P3_sd_d': 'sd/d',
          }
          for n in dexs:
              data = z.read(n)
              if b'tmead' in data and b'mobilead' in data:
                  print('候选 P1/P2 dex:', n); open('p12.dex','wb').write(data)
              if b'fireeye' in data:
                  print('候选 P3 dex:', n); open('p3.dex','wb').write(data)
          EOF
          java -jar /usr/local/bin/baksmali.jar d p12.dex -o chk12 && java -jar /usr/local/bin/baksmali.jar d p3.dex -o chk3
          echo "== P1 桩生效: h()V 首指令 return-void =="
          awk '/\.method public static h\(\)V/,/\.end method/' chk12/cn/kuwo/mod/mobilead/tmead/c.smali | head -5
          echo "== P2 桩生效: ConfigManager/ServiceManager init 已 nop =="
          awk '/\.method public b\(\)V/,/\.end method/' chk12/b3/a.smali | grep -E 'nop|init' | head -8
          echo "== P3 桩生效: FireEye init/start 已 nop =="
          awk '/public b\(Landroid\/content\/Context;Ljava\/lang\/String;\)V/,/\.end method/' chk3/sd/d.smali | grep -E 'nop|init|start' | head -8

      - name: 计算 round + 发 Release + 回写报告
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE"
          LAST=$(gh release list -R "$GITHUB_REPOSITORY" 2>/dev/null | grep -oE 'kuwo3-round[0-9]+' | grep -oE '[0-9]+' | sort -n | tail -1 || true)
          N=$(( ${LAST:-0} + 1 ))
          OUT="kuwo-12.2.2.0-purified-r${N}.apk"
          cp work/signed.apk "work/$OUT"
          cp work/sha256-kuwo3b2.txt work/sha256-r${N}.txt
          gh release create "kuwo3-round${N}" --title "KUWO-3b2 净化重打包 round ${N}" \
            --notes "老马点位表 3 处 patch：TMEAds init 枢纽 return-void + rif 2 init nop + fireeye 2 invoke nop；其余候选未碰（宁残骸不断链）；本线自签 keystore CN=KUWO-Purify v1v2v3；三桩 dex 反解验证过。run ${GITHUB_RUN_ID}" \
            "work/$OUT" work/patch-kuwo3b2.log work/patch-evidence.txt work/verify-kuwo3b2.txt work/sha256-r${N}.txt
          {
            echo "# KUWO-3b2 round ${N} 构建报告（run ${GITHUB_RUN_ID}）"
            echo
            echo "- 产物：Release kuwo3-round${N} / ${OUT}"
            echo "- sha256：$(cut -d' ' -f1 work/sha256-kuwo3b2.txt)"
            echo "- 大小：$(stat -c %s "work/$OUT") B"
            echo "- patch 点：P1=1（c.h()V return-void）/ P2=2（b3/a ConfigManager+ServiceManager init nop）/ P3=2（sd/d FireEye init+start nop）——与点位表全集一致，其余候选未碰"
            echo "- 签名：本线新生成 keystore CN=KUWO-Purify（cert sha256 见 verify-kuwo3b2.txt），v1+v2+v3"
            echo "- 验证：apksigner verify 过 + 三桩 dex 反解生效（c.smali h()V 首指令 return-void、b3/a 与 sd/d invoke→nop）+ dex 数 15"
            echo "- 版本一致性：round 单源=Release tag kuwo3-round${N} 自动递增（${LAST:-无}→${N}），产物名/报告/tag 三处同源"
          } > docs/kuwo3b2-build-report.md
          git config user.name "codery-ci"
          git config user.email "codery-ci@noreply"
          git add docs/kuwo3b2-build-report.md
          git commit -m "docs(KUWO-3b2): round ${N} 净化构建——3 处 patch + 三桩验证（apk 见 Release kuwo3-round${N}）" || echo "无变更"
          git pull --rebase origin main && git push origin main
          echo "== 产物 $OUT sha=$(cut -d' ' -f1 work/sha256-kuwo3b2.txt) size=$(stat -c %s "work/$OUT")"

      - name: 清理版权物
        if: always()
        run: rm -rf work
