name: dm-dex-method-diff

# DM-1 W1：东明版 18dex vs 官方 15dex 方法级全量 diff（rid recvvcvacUOp2j）
# 配方继承 kuwo-crack-audit：重活全在 runner，CT110/本机零重活（D7）。
# 双侧同集合口径 + 归一化剥噪 + 体首 return 截断专表（派单 §1-W1）。
# bash -e 下所有 grep -c 赋值尾缀 || true（老线三败根因，见 79f.../fe7a5e 修复史）。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 下载 baksmali 3.0.10
        run: |
          curl -sSL -o /usr/local/bin/baksmali.jar https://github.com/baksmali/smali/releases/download/3.0.10/baksmali-3.0.10-fat.jar
          java -jar /usr/local/bin/baksmali.jar --version

      - name: 拉样本 + sha256 硬校验
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work && cd work
          gh release download dm-samples -R "$GITHUB_REPOSITORY" \
            -p 'dongming-kuwo-12.2.2.0.apk' -p 'kuwo-12.2.2.0-official.apk' -D .
          echo "50251119906266d50b872af8de4372c95b40548e175630b85af918e985d43588  dongming-kuwo-12.2.2.0.apk" | sha256sum -c -
          echo "04d89f31046d544be00a0c413bc5ea3ddd4040d3157bd2e96ca7a9194df0c882  kuwo-12.2.2.0-official.apk" | sha256sum -c -
          df -h .

      - name: 解包双侧全量 dex
        run: |
          cd work
          python3 - <<'EOF'
          import zipfile, os
          os.makedirs('mod-dex', exist_ok=True); os.makedirs('base-dex', exist_ok=True)
          def dump(apk, dout):
              z = zipfile.ZipFile(apk)
              dexs = [n for n in z.namelist() if n.startswith('classes') and n.endswith('.dex')]
              for n in dexs:
                  open(os.path.join(dout, n), 'wb').write(z.read(n))
              return len(dexs)
          print('mod dex:', dump('dongming-kuwo-12.2.2.0.apk', 'mod-dex'))
          print('base dex:', dump('kuwo-12.2.2.0-official.apk', 'base-dex'))
          EOF

      - name: baksmali 双侧全量反编译
        run: |
          cd work
          for D in mod-dex/classes*.dex; do N=$(basename "$D" .dex); java -Xmx4g -jar /usr/local/bin/baksmali.jar d "$D" -o "smali-mod/$N"; done
          for D in base-dex/classes*.dex; do N=$(basename "$D" .dex); java -Xmx4g -jar /usr/local/bin/baksmali.jar d "$D" -o "smali-base/$N"; done
          M=$(find smali-mod -name '*.smali' | wc -l); B=$(find smali-base -name '*.smali' | wc -l)
          echo "smali-mod=$M smali-base=$B"
          test "$M" -gt 100000 && test "$B" -gt 100000 || { echo "FATAL: smali 文件数异常"; exit 1; }

      - name: 方法级 diff（归一化+截断专表）
        run: |
          cd "$GITHUB_WORKSPACE"
          python3 scripts/dm1_method_diff.py "$PWD/work" 2>&1 | tee work/dm1-run.log
          grep -q 'truncated=' work/dm1-run.log || { echo "FATAL: diff 未正常收口"; exit 1; }
          cd work
          tar czf dm-out/dm1-smali-mod.tar.gz smali-mod
          du -h dm-out/* | sort -rh

      - name: 回写报告到 docs/dm/
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p docs/dm
          cp work/dm-out/dm1-dex-method-diff.md docs/dm/dm1-dex-method-diff.md
          cp work/dm-out/dm1-stats.md docs/dm/dm1-stats.md
          git config user.name "codery-ci"
          git config user.email "codery-ci@noreply"
          git add docs/dm/
          git commit -m "docs(DM-1): W1 东明vs官方 方法级diff+体首return截断表（CI 回写）" || echo "无变更"
          ok=0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && { ok=1; break; }
            sleep $((i * 4))
          done
          test "$ok" = 1 || { echo "FATAL: docs 推送失败"; exit 1; }

      - name: 上传素材到 Release dm1-artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE"
          gh release create dm1-artifacts --title "DM-1 深审素材线产物（W1-W5）" --notes "东明版酷我深审素材：W1 方法级diff表+mod全量smali归档；W2 去广告点位交叉；W3 三so深查；W4 作者类反编译；W5 dcxll 消费方。样本本体在 dm-samples。" 2>/dev/null || true
          cd work/dm-out
          gh release upload dm1-artifacts dm1-method-changes.tsv dm1-return-truncated.tsv dm1-new-classes.tsv dm1-removed-classes.tsv dm1-smali-mod.tar.gz --clobber

      - name: 清理版权物
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/work" || true
